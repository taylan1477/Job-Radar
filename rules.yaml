# ==============================================================================
# Job Radar – Merkezi Kural ve Skorlama Yapılandırması (rules.yaml)
# ==============================================================================
# Bu dosya tüm arama sorgularını, skorlama ağırlıklarını, alan kategorilerini
# ve anahtar kelimeleri tek bir merkezden yönetmenizi sağlar.
# Kod değiştirmeden buradaki puanları veya kelimeleri düzenleyebilirsiniz.
# ==============================================================================

# ──────────────────────────────────────────────
# 1. Skor Ağırlıkları (Toplam = 1.0)
# ──────────────────────────────────────────────
weights:
  field: 0.3      # Pozisyon / Alan ağırlığı (%30)
  location: 0.4   # Lokasyon ağırlığı (%40 - Ankara/Remote önceliği)
  level: 0.3      # Seviye ağırlığı (%30 - Junior/Entry önceliği)

# ──────────────────────────────────────────────
# 2. Alan (Field) Puanları & Öncelik Sıralaması
# ──────────────────────────────────────────────
field_scores:
  gamedev: 5                  # 1 Numara Tercih: Oyun Geliştirme
  savunma_simülasyon: 4       # 2 Numara Tercih: Simülasyon, Taktik, Sistem Entegrasyonu
  yazılım: 4                  # 2 Numara Tercih: Genel Yazılım (Backend, Frontend, Fullstack, Mobil, SDET)
  sistem_network: 3           # 3 Numara Tercih: SysAdmin, NOC, Ağ Otomasyonu, SRE
  veri_bi: 3                  # 3 Numara Tercih: DBA, İş Zekası (BI), ETL, Scraping
  endüstriyel_otomasyon: 3    # 3 Numara Tercih: ERP (SAP), SCADA/PLC, Süreç Otomasyonu, WMS
  diğer: 1                    # Destek, İş Analisti, Saha Mühendisliği ve Genel Roller

field_priority:
  - gamedev
  - savunma_simülasyon
  - yazılım
  - sistem_network
  - veri_bi
  - endüstriyel_otomasyon
  - diğer

# ──────────────────────────────────────────────
# 3. Lokasyon Puanları
# ──────────────────────────────────────────────
location_scores:
  ankara: 5
  remote: 5
  hybrid_ankara: 5
  türkiye: 3
  istanbul: 3
  izmir: 2
  bursa: 2
  avrupa: 1
  abd: 0
  diğer: 0
  dead: -10   # Dil engeli veya vize kısıtlı ilanlar

# ──────────────────────────────────────────────
# 4. Deneyim Seviyesi (Level) Puanları
# ──────────────────────────────────────────────
level_scores:
  junior: 5
  entry: 5
  mid: 2
  bilinmiyor: 0
  senior: -10
  lead: -15

